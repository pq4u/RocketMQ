syntax = "proto3";
package rocketmq.v1;
option csharp_namespace = "RocketMQ.Transport.Grpc.Protos";

service Producer {
  rpc Publish (PublishRequest) returns (PublishResponse);
}

message PublishRequest {
  string exchange_name = 1;
  string routing_key = 2;
  bytes payload = 3;
  string correlation_id = 4;
  string publish_id = 5;
  bool include_diagnostics = 6;
}

message PublishResponse {
  bool success = 1;
  string message_id = 2;
  string publish_id = 3;
  string status = 4;
  repeated string destination_queues = 5;
  PublishDiagnostics diagnostics = 6;
}

message PublishDiagnostics {
  double server_total_ms = 1;
  double writer_wait_ms = 2;
  double connection_open_ms = 3;
  double transaction_begin_ms = 4;
  double transaction_work_ms = 5;
  double transaction_commit_ms = 6;
  double cleanup_ms = 7;
  double fingerprint_ms = 8;
  double idempotency_lookup_ms = 9;
  double exchange_lookup_ms = 10;
  double routing_ms = 11;
  double publication_insert_ms = 12;
  double enqueue_ms = 13;
  double result_read_ms = 14;
  int32 batch_size = 15;
  double batch_assembly_ms = 16;
}

service Consumer {
  rpc LeaseNext (LeaseRequest) returns (LeaseResponse);
  rpc Ack (AckRequest) returns (AckResponse);
  rpc Nack (NackRequest) returns (AckResponse);
}

message LeaseRequest {
  string queue_name = 1;
  int32 visibility_timeout_seconds = 2;
}

message LeaseResponse {
  string lease_id = 1;
  bytes payload = 2;
  int32 delivery_count = 3;
  string correlation_id = 4;
  string message_id = 5;
}

message AckRequest {
  string lease_id = 1;
}

message NackRequest {
  string lease_id = 1;
  bool requeue = 2;
}

message AckResponse {}

service Admin {
  rpc DeclareExchange (DeclareExchangeRequest) returns (AdminResponse);
  rpc DeclareQueue (DeclareQueueRequest) returns (AdminResponse);
  rpc Bind (BindRequest) returns (AdminResponse);
}

message DeclareExchangeRequest {
  string exchange_name = 1;
  string exchange_type = 2;
}

message DeclareQueueRequest {
  string queue_name = 1;
}

message BindRequest {
  string queue_name = 1;
  string exchange_name = 2;
  string routing_key = 3;
}

message AdminResponse {
  bool success = 1;
}
